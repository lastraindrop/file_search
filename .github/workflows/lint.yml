name: Lint

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff (authoritative linter + import sorter)
        # ruff is the project's single source of truth for linting and import
        # ordering (pyproject [tool.ruff.lint] selects E/F/W/I/N/UP/B/D/C4/
        # RET/SIM). black/isort were removed from the gate because the
        # codebase is ruff-lint-clean but not black-formatted; keeping them
        # here produced a perpetually-failing, misleading CI signal.
        run: ruff check .

      - name: Run black check
        # Non-blocking advisory: the codebase predates black formatting.
        # `continue-on-error` keeps this informative without failing CI.
        continue-on-error: true
        run: black --check .
